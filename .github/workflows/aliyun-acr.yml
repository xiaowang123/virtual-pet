# 构建并推送镜像到阿里云容器镜像服务 ACR
# 使用前在仓库 Settings → Secrets and variables 里配置:
#   ALIYUN_ACR_REGISTRY  例: registry.cn-hangzhou.aliyuncs.com
#   ALIYUN_ACR_NAMESPACE 例: pet (你的 ACR 命名空间, 个人版在实例内创建)
#   ALIYUN_ACR_USERNAME  例: 你的阿里云账号名
#   ALIYUN_ACR_PASSWORD  例: 控制台创建的镜像仓库固定密码
name: 构建并推送镜像到阿里云 ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  IMAGE: cloud-pet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 可选: 推送到 ECS 后自动更新容器 (需在 ECS 上跑过 docker login ACR)
